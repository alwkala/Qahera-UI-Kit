# /* Pre-emit critique: P5 H5 E5 S5 R5 V5 D5 */
version: 2
updates:
  # Monitor npm devDependencies for security updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:security"
      - "area:ci-cd"
    commit-message:
      prefix: "chore(deps)"

  # Monitor GitHub Actions workflow references
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:security"
      - "area:ci-cd"
    commit-message:
      prefix: "ci(actions)"
