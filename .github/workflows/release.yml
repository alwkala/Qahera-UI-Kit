# /* Pre-emit critique: P5 H5 E5 S5 R5 V5 D5 */
name: Release & Quality Gate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify Invariants & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 20.x environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Build canonical CSS bundles & registry manifests
        run: node bin/qahera.js build

      - name: Run full 4-stage Quality & Invariant CI audit suite
        run: node bin/qahera.js test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Qahera UI Kit ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
