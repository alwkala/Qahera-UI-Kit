version: 1.0.0
taxonomy:
  prefix: "--qhr-"
  categories:
    - color: [primary, secondary, neutral, success, warning, danger, info]
    - space: [0, 1, 1.5, 2, 2.5, 3, 3.5, 4, 5, 6, 8, 10, 12, 16, 20, 24]
    - radius: [none, xs, sm, md, lg, xl, pill]
    - shadow: [none, xs, sm, md, lg, xl]
    - typography:
        display: "El Messiri, serif"
        body: "Tajawal, sans-serif"
        mono: "JetBrains Mono, monospace"
    - motion:
        durations: [instant: "0ms", fast: "150ms", normal: "250ms", slow: "400ms"]
        easing: [standard: "cubic-bezier(0.2, 0, 0, 1)", entrance: "cubic-bezier(0, 0, 0.2, 1)", exit: "cubic-bezier(0.4, 0, 1, 1)", emphasized: "cubic-bezier(0.2, 0, 0, 1)"]
    - z-index: [dropdown: 1000, sticky: 1100, modal: 1200, popover: 1300, toast: 1400, tooltip: 1500]
