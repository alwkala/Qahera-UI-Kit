<!-- Qahera UI Kit - Master Avatar Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. المقاسات وتكديس المجموعات (Sizes & Avatar Groups)</h3>
    <div style="display: flex; flex-direction: column; gap: 24px; background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      
      <!-- Sizes -->
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="qhr-avatar qhr-avatar--circle qhr-avatar--xs">ع</span>
        <span class="qhr-avatar qhr-avatar--circle qhr-avatar--sm">س</span>
        <span class="qhr-avatar qhr-avatar--circle qhr-avatar--md">م</span>
        <span class="qhr-avatar qhr-avatar--circle qhr-avatar--lg">ف</span>
        <span class="qhr-avatar qhr-avatar--circle qhr-avatar--xl qhr-avatar--luxury">ق</span>
      </div>

      <!-- Avatar with Status Dot -->
      <div style="display: flex; align-items: center; gap: 20px;">
        <div class="qhr-avatar qhr-avatar--circle qhr-avatar--lg">
          <span>أح</span>
          <span class="qhr-avatar-status qhr-avatar-status--online"></span>
        </div>
        <div class="qhr-avatar qhr-avatar--circle qhr-avatar--lg">
          <span>يو</span>
          <span class="qhr-avatar-status qhr-avatar-status--offline"></span>
        </div>
      </div>

      <!-- Avatar Group -->
      <div>
        <div class="qhr-avatar-group">
          <span class="qhr-avatar qhr-avatar--circle qhr-avatar--md">أح</span>
          <span class="qhr-avatar qhr-avatar--circle qhr-avatar--md">مح</span>
          <span class="qhr-avatar qhr-avatar--circle qhr-avatar--md">فا</span>
          <span class="qhr-avatar qhr-avatar--circle qhr-avatar--md qhr-avatar--luxury">+8</span>
        </div>
      </div>

    </div>
  </div>

</div>
