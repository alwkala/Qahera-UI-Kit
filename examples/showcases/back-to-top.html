<!-- Qahera UI Kit - Master BackToTop Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. زر الصعود لأعلى الصفحة (BackToTop Trigger Button)</h3>
    <div style="background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border); display: flex; align-items: center; justify-content: space-between;">
      <div>
        <h4 style="margin: 0 0 6px 0; color: var(--q-text-primary);">زر عائم ذكي للصعود السلس</h4>
        <p style="margin: 0; color: var(--q-text-secondary); font-size: 0.85rem;">يظهر تلقائياً عند تجاوز التمرير لمسافة محددة في الصفحة.</p>
      </div>
      <button type="button" class="qhr-back-to-top" style="position: static;" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="صعود للأعلى">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
    </div>
  </div>

</div>
