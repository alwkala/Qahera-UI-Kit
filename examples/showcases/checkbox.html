<!-- Qahera UI Kit - Master Checkbox Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. مربعات الاختيار القياسية والنغمات (Standard Checkboxes)</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 24px; background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      <label class="qhr-checkbox">
        <input type="checkbox" checked>
        <span>الخيار الافتراضي (Primary Gold)</span>
      </label>
      <label class="qhr-checkbox qhr-checkbox--success">
        <input type="checkbox" checked>
        <span>تأكيدي (Success)</span>
      </label>
      <label class="qhr-checkbox qhr-checkbox--danger">
        <input type="checkbox" checked>
        <span>تحذيري (Danger)</span>
      </label>
      <label class="qhr-checkbox">
        <input type="checkbox" disabled>
        <span>معطل (Disabled)</span>
      </label>
    </div>
  </div>

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">2. بطاقات الاختيار التفاعلية (Card Checkboxes)</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
      
      <label class="qhr-checkbox-card">
        <input type="checkbox" checked style="margin-block-start: 4px;">
        <div>
          <div style="font-weight: 700; color: var(--q-text-primary);">المصادقة الثنائية (2FA)</div>
          <p style="margin: 4px 0 0 0; font-size: 0.8rem; color: var(--q-text-secondary); line-height: 1.5;">تأمين تسجيل الدخول عبر إرسال رموز التحقق إلى هاتفك المحمول.</p>
        </div>
      </label>

      <label class="qhr-checkbox-card">
        <input type="checkbox" style="margin-block-start: 4px;">
        <div>
          <div style="font-weight: 700; color: var(--q-text-primary);">تنبيهات البريد الأسبوعية</div>
          <p style="margin: 4px 0 0 0; font-size: 0.8rem; color: var(--q-text-secondary); line-height: 1.5;">موجز أسبوعي بأهم مقاييس الأداء وتحديثات الفريق.</p>
        </div>
      </label>

    </div>
  </div>

</div>
