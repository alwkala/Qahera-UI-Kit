<!-- Qahera UI Kit - Master Chip Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. رقائق التصفية والوسوم (Filter & Tag Chips)</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      <span class="qhr-chip qhr-chip--md">الكل</span>
      <span class="qhr-chip qhr-chip--md qhr-chip--primary">
        <span>قاهرة الفاطمية</span>
        <button type="button" class="qhr-chip-remove" aria-label="حذف">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
      <span class="qhr-chip qhr-chip--md">
        <span>المكونات النشطة</span>
        <button type="button" class="qhr-chip-remove" aria-label="حذف">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
    </div>
  </div>

</div>
