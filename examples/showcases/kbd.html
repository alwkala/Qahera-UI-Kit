<!-- Qahera UI Kit - Master Kbd Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. اختصارات لوحة المفاتيح (Keyboard Shortcuts)</h3>
    <div style="display: flex; flex-direction: column; gap: 16px; background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border); max-width: 480px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="color: var(--q-text-secondary); font-size: 0.9rem;">فتح قائمة الأوامر الذكية</span>
        <div style="display: flex; gap: 4px;">
          <kbd class="qhr-kbd qhr-kbd--md">Ctrl</kbd>
          <kbd class="qhr-kbd qhr-kbd--md">K</kbd>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="color: var(--q-text-secondary); font-size: 0.9rem;">حفظ التغييرات الفوري</span>
        <div style="display: flex; gap: 4px;">
          <kbd class="qhr-kbd qhr-kbd--md">Ctrl</kbd>
          <kbd class="qhr-kbd qhr-kbd--md">S</kbd>
        </div>
      </div>
    </div>
  </div>

</div>
