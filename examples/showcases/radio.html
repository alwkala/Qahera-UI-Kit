<!-- Qahera UI Kit - Master Radio Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. أزرار الاختيار الدائرية (Standard Radio Options)</h3>
    <div style="display: flex; flex-direction: column; gap: 16px; background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      <label class="qhr-radio">
        <input type="radio" name="r1" checked>
        <span>الدفع الفوري عبر البطاقة الائتمانية</span>
      </label>
      <label class="qhr-radio">
        <input type="radio" name="r1">
        <span>التحويل البنكي المباشر</span>
      </label>
      <label class="qhr-radio">
        <input type="radio" name="r1">
        <span>الدفع عند الاستلام</span>
      </label>
    </div>
  </div>

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">2. بطاقات الخيارات الغنية (Rich Radio Cards)</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
      
      <label class="qhr-radio-card">
        <input type="radio" name="tier" checked style="margin-block-start: 4px;">
        <div>
          <div style="font-weight: 700; color: var(--q-gold);">باقة الاستوديو المستقل</div>
          <p style="margin: 4px 0 0 0; font-size: 0.8rem; color: var(--q-text-secondary); line-height: 1.5;">للمطورين المستقلين والمصممين المحترفين.</p>
        </div>
      </label>

      <label class="qhr-radio-card">
        <input type="radio" name="tier" style="margin-block-start: 4px;">
        <div>
          <div style="font-weight: 700; color: var(--q-text-primary);">باقة الشركات الناشئة</div>
          <p style="margin: 4px 0 0 0; font-size: 0.8rem; color: var(--q-text-secondary); line-height: 1.5;">للفرق النامية حتى 15 مستخدماً مع دعم متقدم.</p>
        </div>
      </label>

    </div>
  </div>

</div>
