<!-- Qahera UI Kit - Master Select Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. قوائم الاختيار والمقاسات (Select Dropdowns & Sizes)</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
      <div>
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-block-end: 6px; color: var(--q-text-secondary);">قائمة صغيرة (Small)</label>
        <select class="qhr-select qhr-select--sm">
          <option>القاهرة</option>
          <option>الإسكندرية</option>
          <option>الجيزة</option>
          <option>أسوان</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-block-end: 6px; color: var(--q-text-secondary);">قائمة متوسطة قياسية (Medium)</label>
        <select class="qhr-select">
          <option>اللغة العربية (الفصحى)</option>
          <option>English (International)</option>
          <option>Français</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-block-end: 6px; color: var(--q-text-secondary);">قائمة كبيرة (Large)</label>
        <select class="qhr-select qhr-select--lg">
          <option>المستوى الماسي الفاخر (Obsidian Diamond)</option>
          <option>المستوى الذهبي (Gold Tier)</option>
          <option>المستوى الفضي (Silver Tier)</option>
        </select>
      </div>
    </div>
  </div>

</div>
