<!-- Qahera UI Kit - Master Skeleton Showcase -->
<div style="display: flex; flex-direction: column; gap: 28px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. هياكل البطاقات والملفات الشخصية (Card & Profile Skeleton)</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
      
      <!-- Profile Card Skeleton -->
      <div class="qhr-card" style="padding: 24px;">
        <div style="display: flex; align-items: center; gap: 14px; margin-block-end: 16px;">
          <div class="qhr-skeleton qhr-skeleton--circular" style="width: 52px; height: 52px;"></div>
          <div style="flex: 1;">
            <div class="qhr-skeleton qhr-skeleton--text" style="width: 60%; height: 16px;"></div>
            <div class="qhr-skeleton qhr-skeleton--text" style="width: 40%; height: 12px; margin-block-start: 6px;"></div>
          </div>
        </div>
        <div class="qhr-skeleton qhr-skeleton--text" style="width: 100%; margin-block-end: 8px;"></div>
        <div class="qhr-skeleton qhr-skeleton--text" style="width: 90%; margin-block-end: 8px;"></div>
        <div class="qhr-skeleton qhr-skeleton--text" style="width: 65%;"></div>
      </div>

      <!-- Media Card Skeleton -->
      <div class="qhr-card" style="padding: 20px;">
        <div class="qhr-skeleton qhr-skeleton--rectangular" style="width: 100%; height: 130px; margin-block-end: 16px;"></div>
        <div class="qhr-skeleton qhr-skeleton--heading"></div>
        <div class="qhr-skeleton qhr-skeleton--text" style="width: 100%;"></div>
        <div class="qhr-skeleton qhr-skeleton--text" style="width: 75%;"></div>
      </div>

    </div>
  </div>

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">2. هيكل جدول البيانات (Table Rows Skeleton)</h3>
    <div style="background: var(--q-surface); padding: 20px; border-radius: 16px; border: 1px solid var(--q-border); display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; gap: 16px;">
        <div class="qhr-skeleton" style="width: 25%; height: 18px;"></div>
        <div class="qhr-skeleton" style="width: 35%; height: 18px;"></div>
        <div class="qhr-skeleton" style="width: 20%; height: 18px;"></div>
        <div class="qhr-skeleton" style="width: 20%; height: 18px;"></div>
      </div>
      <div style="display: flex; gap: 16px;">
        <div class="qhr-skeleton" style="width: 25%; height: 14px;"></div>
        <div class="qhr-skeleton" style="width: 35%; height: 14px;"></div>
        <div class="qhr-skeleton" style="width: 20%; height: 14px;"></div>
        <div class="qhr-skeleton" style="width: 20%; height: 14px;"></div>
      </div>
      <div style="display: flex; gap: 16px;">
        <div class="qhr-skeleton" style="width: 25%; height: 14px;"></div>
        <div class="qhr-skeleton" style="width: 35%; height: 14px;"></div>
        <div class="qhr-skeleton" style="width: 20%; height: 14px;"></div>
        <div class="qhr-skeleton" style="width: 20%; height: 14px;"></div>
      </div>
    </div>
  </div>

</div>
