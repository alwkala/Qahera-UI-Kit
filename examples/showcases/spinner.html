<!-- Qahera UI Kit - Master Spinner Showcase -->
<div style="display: flex; flex-direction: column; gap: 28px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. مؤشرات التحميل الدائرية القياسية (Border Spinners)</h3>
    <div style="display: flex; align-items: center; gap: 20px; background: var(--q-surface); padding: 20px; border-radius: 16px; border: 1px solid var(--q-border);">
      <div class="qhr-spinner qhr-spinner--primary qhr-spinner--sm" role="status" aria-label="تحميل"></div>
      <div class="qhr-spinner qhr-spinner--success qhr-spinner--md" role="status" aria-label="تحميل"></div>
      <div class="qhr-spinner qhr-spinner--info qhr-spinner--lg" role="status" aria-label="تحميل"></div>
      <div class="qhr-spinner qhr-spinner--warning qhr-spinner--xl" role="status" aria-label="تحميل"></div>
      <div class="qhr-spinner qhr-spinner--luxury qhr-spinner--xl" role="status" aria-label="تحميل"></div>
    </div>
  </div>

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">2. مؤشرات النبض النقطي (Pulse Dots Spinners)</h3>
    <div style="display: flex; align-items: center; gap: 24px; background: var(--q-surface); padding: 20px; border-radius: 16px; border: 1px solid var(--q-border);">
      <div class="qhr-spinner-dots" style="color: var(--qhr-color-primary-500, #c7a35a);"><span></span><span></span><span></span></div>
      <div class="qhr-spinner-dots" style="color: var(--qhr-color-info-500, #3b82f6);"><span></span><span></span><span></span></div>
      <div class="qhr-spinner-dots" style="color: var(--q-gold);"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">3. التحميل داخل الأزرار والبطاقات (In-Button Spinners)</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 12px;">
      <button type="button" class="qhr-btn qhr-btn--primary qhr-btn--md" disabled>
        <span class="qhr-spinner qhr-spinner--sm" style="color: #fff;"></span>
        <span>جاري التحميل...</span>
      </button>
      <button type="button" class="qhr-btn qhr-btn--luxury qhr-btn--md" disabled>
        <span class="qhr-spinner qhr-spinner--sm" style="color: #121008;"></span>
        <span>توليد الأصول...</span>
      </button>
    </div>
  </div>

</div>
