<!-- Qahera UI Kit - Master Stepper Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. مسار خطوات سير العمل (Horizontal Stepper)</h3>
    <div style="background: var(--q-surface); padding: 28px; border-radius: 16px; border: 1px solid var(--q-border);">
      <ol class="qhr-stepper">
        <li class="qhr-step-item is-completed">
          <span class="qhr-step-indicator">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span class="qhr-step-label">الحساب</span>
          <span class="qhr-step-line"></span>
        </li>
        <li class="qhr-step-item is-current">
          <span class="qhr-step-indicator">2</span>
          <span class="qhr-step-label" style="color: var(--q-gold);">بيانات المنشأة</span>
          <span class="qhr-step-line"></span>
        </li>
        <li class="qhr-step-item">
          <span class="qhr-step-indicator">3</span>
          <span class="qhr-step-label" style="color: var(--q-text-muted);">الدفع والتفعيل</span>
        </li>
      </ol>
    </div>
  </div>

</div>
