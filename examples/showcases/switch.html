<!-- Qahera UI Kit - Master Switch Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. المقاسات والألوان (Sizes & Tones)</h3>
    <div style="display: flex; flex-direction: column; gap: 20px; background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      
      <label class="qhr-switch qhr-switch--sm">
        <input type="checkbox" class="qhr-switch-input" checked>
        <span class="qhr-switch-track"><span class="qhr-switch-thumb"></span></span>
        <span>مفتاح صغير (Small .qhr-switch--sm)</span>
      </label>

      <label class="qhr-switch">
        <input type="checkbox" class="qhr-switch-input" checked>
        <span class="qhr-switch-track"><span class="qhr-switch-thumb"></span></span>
        <span>مفتاح افتراضي (Default Medium)</span>
      </label>

      <label class="qhr-switch qhr-switch--lg">
        <input type="checkbox" class="qhr-switch-input" checked>
        <span class="qhr-switch-track"><span class="qhr-switch-thumb"></span></span>
        <span>مفتاح كبير (Large .qhr-switch--lg)</span>
      </label>

      <label class="qhr-switch qhr-switch--success">
        <input type="checkbox" class="qhr-switch-input" checked>
        <span class="qhr-switch-track"><span class="qhr-switch-thumb"></span></span>
        <span>لون تأكيدي أخضر (Success)</span>
      </label>

      <label class="qhr-switch qhr-switch--danger">
        <input type="checkbox" class="qhr-switch-input" checked>
        <span class="qhr-switch-track"><span class="qhr-switch-thumb"></span></span>
        <span>لون تحذيري أحمر (Danger)</span>
      </label>

    </div>
  </div>

</div>
