<!-- Qahera UI Kit - Master Tabs Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. تبويبات الخط السفلي القياسية (Underline Tabs)</h3>
    <div class="qhr-tabs" style="background: var(--q-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      <div class="qhr-tablist" role="tablist">
        <button type="button" class="qhr-tab-btn is-active">نظرة عامة</button>
        <button type="button" class="qhr-tab-btn">المواصفات التقنية</button>
        <button type="button" class="qhr-tab-btn">الأمثلة الحية</button>
        <button type="button" class="qhr-tab-btn">سجل التغييرات</button>
      </div>
      <div class="qhr-tabpanel is-active">
        <p style="margin: 0; color: var(--q-text-secondary); line-height: 1.6;">محتوى التبويب الأول: استعراض شامل لمعمارية المكون ومبادئ التصميم النظيف.</p>
      </div>
    </div>
  </div>

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">2. التحكم المقسم الكبسولي (Segmented Control Tabs)</h3>
    <div class="qhr-tabs qhr-tabs--segmented">
      <div class="qhr-tablist">
        <button type="button" class="qhr-tab-btn is-active">الشهري</button>
        <button type="button" class="qhr-tab-btn">السنوي (خصم 20%)</button>
        <button type="button" class="qhr-tab-btn">مدى الحياة</button>
      </div>
    </div>
  </div>

</div>
