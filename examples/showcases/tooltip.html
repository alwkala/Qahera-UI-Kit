<!-- Qahera UI Kit - Master Tooltip Showcase -->
<div style="display: flex; flex-direction: column; gap: 32px; width: 100%;">

  <div>
    <h3 style="font-family: var(--q-font-heading); font-size: 1.1rem; margin-block-end: 16px; color: var(--q-text-primary);">1. التلميحات النصية بكافة الاتجاهات (Tooltip Placements)</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; background: var(--q-surface); padding: 48px 24px; border-radius: 16px; border: 1px solid var(--q-border);">
      
      <div class="qhr-tooltip-trigger">
        <button type="button" class="qhr-btn qhr-btn--outline qhr-btn--sm">تلميح لأعلى (Top)</button>
        <span class="qhr-tooltip">تلميح نصي علوي دقيق</span>
      </div>

      <div class="qhr-tooltip-trigger">
        <button type="button" class="qhr-btn qhr-btn--outline qhr-btn--sm">تلميح لأسفل (Bottom)</button>
        <span class="qhr-tooltip qhr-tooltip--bottom">تلميح نصي سفلي</span>
      </div>

      <div class="qhr-tooltip-trigger">
        <button type="button" class="qhr-btn qhr-btn--outline qhr-btn--sm">تلميح في البداية (Start)</button>
        <span class="qhr-tooltip qhr-tooltip--start">محاذاة منطقية لجهة البداية</span>
      </div>

      <div class="qhr-tooltip-trigger">
        <button type="button" class="qhr-btn qhr-btn--outline qhr-btn--sm">تلميح في النهاية (End)</button>
        <span class="qhr-tooltip qhr-tooltip--end">محاذاة لجهة النهاية</span>
      </div>

      <div class="qhr-tooltip-trigger">
        <button type="button" class="qhr-btn qhr-btn--luxury qhr-btn--sm">تلميح ذهبي فاخر (Luxury)</button>
        <span class="qhr-tooltip qhr-tooltip--luxury">تلميح مع مظهر قاهرة الفاخر</span>
      </div>

    </div>
  </div>

</div>
