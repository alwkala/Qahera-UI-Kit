<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="qhrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D79E" />
      <stop offset="35%" stop-color="#D4A853" />
      <stop offset="70%" stop-color="#C98818" />
      <stop offset="100%" stop-color="#8F5E0C" />
    </linearGradient>
    <linearGradient id="qhrBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090C11" />
    </linearGradient>
    <filter id="qhrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D4A853" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#qhrBgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#qhrGoldGrad)" stroke-width="8" stroke-opacity="0.85" />

  <!-- Inner Architectural Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#D4A853" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Qahera Architectural Monogram (Centered) -->
  <g filter="url(#qhrGlow)" transform="translate(64, 64) scale(0.75)">
    <image href="data:image/webp;base64," width="512" height="512" />
  </g>
</svg>
