<!-- Qahera UI Kit - Native HTML Alert -->
<div class="qhr-alert qhr-alert--info" role="alert" data-tone="info">
  <div class="qhr-alert-icon">
    <svg class="qhr-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="16" x2="12" y2="12" />
      <line x1="12" y1="8" x2="12.01" y2="8" />
    </svg>
  </div>
  <div class="qhr-alert-content">
    <strong class="qhr-alert-title">تنبيه معلوماتي</strong>
    <p class="qhr-alert-message">تم تحديث بيانات الجلسة بنجاح وفقاً للمواصفات المعيارية للنظام.</p>
  </div>
  <button type="button" class="qhr-alert-close" aria-label="إغلاق التنبيه" onclick="this.closest('.qhr-alert').remove()">
    <svg class="qhr-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
