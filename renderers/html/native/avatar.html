<!-- Qahera UI Kit - Native HTML Avatar -->
<div class="qhr-avatar-group">
  <!-- Circle with Initials -->
  <span class="qhr-avatar qhr-avatar--circle qhr-avatar--md" data-size="md" data-shape="circle">
    <span class="qhr-avatar-fallback">وك</span>
  </span>

  <!-- Rounded with Initials and Online Status -->
  <div class="qhr-avatar-wrapper">
    <span class="qhr-avatar qhr-avatar--rounded qhr-avatar--md" data-size="md" data-shape="rounded">
      <span class="qhr-avatar-fallback">قه</span>
    </span>
    <span class="qhr-avatar-status qhr-avatar-status--online" aria-label="متصل الآن"></span>
  </div>
</div>
