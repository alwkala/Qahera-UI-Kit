<!-- Qahera UI Kit - BackToTop Component (Native HTML) -->
<button
  type="button"
  class="qhr-back-to-top qhr-back-to-top--luxury"
  x-data="qhrBackToTop({ threshold: 350 })"
  x-show="visible"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-4"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-4"
  @click="scrollToTop()"
  aria-label="العودة لأعلى الصفحة"
  style="position: fixed; inset-inline-end: 24px; bottom: 24px; z-index: 900; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; background-color: #17120F; border: 1px solid rgba(212, 175, 55, 0.4); color: #D4AF37; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);"
>
  <svg class="qhr-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 15l7-7 7 7" />
  </svg>
</button>
