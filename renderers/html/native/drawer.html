<!-- Qahera UI Kit — Drawer Component (Native HTML5) -->
<div class="qhr-drawer-backdrop" id="drawer-backdrop" data-state="closed"></div>
<aside class="qhr-drawer qhr-drawer--start qhr-drawer--md" id="app-drawer" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="drawer-heading">
  <div class="qhr-drawer-header">
    <h3 class="qhr-drawer-title" id="drawer-heading">تصفية النتائج المتقدمة</h3>
    <button type="button" class="qhr-btn qhr-btn--ghost qhr-btn--sm" aria-label="إغلاق اللوحة الجانبية" onclick="document.getElementById('app-drawer').setAttribute('data-state', 'closed'); document.getElementById('drawer-backdrop').setAttribute('data-state', 'closed');">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <div class="qhr-drawer-body">
    <p class="qhr-text-muted">محتويات لوحة التصفية الجانبية المتقدمة والخيارات المعقدة.</p>
  </div>
  <div class="qhr-drawer-footer">
    <button type="button" class="qhr-btn qhr-btn--secondary qhr-btn--sm">إعادة ضبط</button>
    <button type="button" class="qhr-btn qhr-btn--primary qhr-btn--sm">تطبيق الفلاتر</button>
  </div>
</aside>
