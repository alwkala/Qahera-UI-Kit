<!-- Qahera UI Kit - Native HTML Input -->
<div class="qhr-form-group">
  <label for="field-email" class="qhr-label">البريد الإلكتروني <span class="qhr-label-required">*</span></label>
  <div class="qhr-input-wrapper">
    <span class="qhr-input-icon qhr-input-icon--start">
      <svg class="qhr-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
        <polyline points="22,6 12,13 2,6" />
      </svg>
    </span>
    <input 
      type="email" 
      id="field-email" 
      name="email" 
      class="qhr-input qhr-input--has-start-icon" 
      placeholder="user@example.com" 
      required>
  </div>
  <span class="qhr-form-hint">لن نقوم بمشاركة بريدك الإلكتروني مع أي طرف خارجي.</span>
</div>
