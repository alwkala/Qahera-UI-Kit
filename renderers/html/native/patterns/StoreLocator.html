<!-- Qahera UI Kit - Store Locator Pattern (Native HTML) -->
<section class="qhr-store-locator" style="padding: 60px 0;">
  <div style="text-align: center; margin-bottom: 40px;">
    <h3 style="font-family: var(--qhr-font-family-display, serif); font-size: 32px; font-weight: 700; color: #F7F3ED; margin-bottom: 8px;">
      فروعنا وصالات العرض
    </h3>
    <p style="color: #B9A896; font-size: 15px;">تفضل بزيارتنا في القاهرة والمدن الإقليمية لتجربة مقتنياتنا يدوياً</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
    <div class="qhr-card" style="background-color: #17120F; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
          <span style="font-size: 12px; color: #D4AF37; font-weight: 600;">القاهرة</span>
          <span class="qhr-badge qhr-badge--outline qhr-badge--xs" style="color: var(--qhr-color-success-500); border-color: var(--qhr-color-success-500);">
            مفتوح الآن
          </span>
        </div>

        <h4 style="font-size: 18px; font-weight: 700; color: #F7F3ED; margin-bottom: 8px;">
          صالة العرض الرئيسية — الزمالك
        </h4>

        <p style="font-size: 13px; color: #B9A896; line-height: 1.6; margin-bottom: 12px;">
          شارع حسن صبري، الزمالك، القاهرة
        </p>

        <div style="font-size: 12px; color: #8C7E70; display: flex; flex-direction: column; gap: 4px;">
          <div>ساعات العمل: يومياً: 10:00 ص - 10:00 م</div>
          <div>الهاتف: +20 2 2736 0000</div>
        </div>
      </div>

      <div style="margin-top: 20px; display: flex; gap: 8px;">
        <button type="button" class="qhr-btn qhr-btn--outline qhr-btn--sm" style="flex: 1; border-color: rgba(212, 175, 55, 0.3); color: #D4AF37;">
          <span>تفاصيل الفرع</span>
        </button>
      </div>
    </div>
  </div>
</section>
