<!-- Qahera UI Kit - Native HTML Progress -->
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 480px;">

  <!-- Standard Deterministic Progress with Label -->
  <div class="qhr-progress-wrapper">
    <div class="qhr-progress-header">
      <span class="qhr-progress-title">اكتمال تهيئة النظام</span>
      <span class="qhr-progress-val">75%</span>
    </div>
    <div class="qhr-progress qhr-progress--primary qhr-progress--md" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
      <div class="qhr-progress-bar" style="width: 75%;"></div>
    </div>
  </div>

  <!-- Indeterminate Streaming Progress -->
  <div class="qhr-progress-wrapper">
    <div class="qhr-progress-header">
      <span class="qhr-progress-title">جاري مزامنة البيانات عبر السحابة...</span>
    </div>
    <div class="qhr-progress qhr-progress--indeterminate qhr-progress--info qhr-progress--sm" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="qhr-progress-bar"></div>
    </div>
  </div>

  <!-- Animated Striped Progress -->
  <div class="qhr-progress qhr-progress--striped qhr-progress--animated qhr-progress--success qhr-progress--lg" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
    <div class="qhr-progress-bar" style="width: 90%;">90% تم بنجاح</div>
  </div>

  <!-- Luxury Egyptian Gold Gradient Progress -->
  <div class="qhr-progress qhr-progress--luxury qhr-progress--md" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
    <div class="qhr-progress-bar" style="width: 60%;"></div>
  </div>

</div>
