<!-- Qahera UI Kit - Native HTML Radio -->
<div class="qhr-radio-group" role="radiogroup" aria-labelledby="radio-group-label">
  <span id="radio-group-label" class="qhr-label">خطة الاشتراك:</span>
  
  <label class="qhr-radio-wrapper">
    <input type="radio" class="qhr-radio" name="plan" value="starter" checked>
    <span class="qhr-radio-label">الباقة الأساسية (مجانية)</span>
  </label>

  <label class="qhr-radio-wrapper">
    <input type="radio" class="qhr-radio" name="plan" value="pro">
    <span class="qhr-radio-label">الباقة الاحترافية (99 ر.س / شهرياً)</span>
  </label>

  <label class="qhr-radio-wrapper">
    <input type="radio" class="qhr-radio" name="plan" value="enterprise">
    <span class="qhr-radio-label">باقة المؤسسات (مخصصة)</span>
  </label>
</div>
