<!-- Qahera UI Kit - Native HTML Switch -->
<div style="display: flex; flex-direction: column; gap: 14px;">
  <!-- Active Switch -->
  <label class="qhr-switch">
    <input type="checkbox" role="switch" class="qhr-switch-input" checked>
    <span class="qhr-switch-track">
      <span class="qhr-switch-thumb"></span>
    </span>
    <span style="font-size: 14px; font-weight: 600;">تفعيل الإشعارات الفورية</span>
  </label>

  <!-- Inactive Switch -->
  <label class="qhr-switch">
    <input type="checkbox" role="switch" class="qhr-switch-input">
    <span class="qhr-switch-track">
      <span class="qhr-switch-thumb"></span>
    </span>
    <span style="font-size: 14px; font-weight: 600;">النسخ الاحتياطي التلقائي</span>
  </label>
</div>
