<!-- Qahera UI Kit - HTMX Inline Alert Fragment (Static / Language-Agnostic) -->
<div class="qhr-alert qhr-alert--danger" role="alert" data-tone="danger">
  <span class="qhr-alert-icon" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
  </span>
  <div class="qhr-alert-content">
    <div class="qhr-alert-title">خطأ في التحقق من البيانات</div>
    <div class="qhr-alert-desc">تعذر إتمام العملية المطلوبة، يرجى مراجعة الحقول الإلزامية والمحاولة مرة أخرى.</div>
  </div>
  <button type="button" class="qhr-alert-close" onclick="this.closest('.qhr-alert').remove()" aria-label="إغلاق التنبيه">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
