<!-- Qahera UI Kit - HTMX Button Fragment with Animated Spinner Indicator -->
<button 
  type="button"
  class="qhr-btn qhr-btn--primary qhr-btn--md"
  hx-post="/api/submit"
  hx-target="this"
  hx-swap="outerHTML"
  hx-disabled-elt="this"
  hx-indicator="#qhr-btn-spinner-action"
>
  <span class="qhr-btn-label">إرسال الطلب</span>

  <span id="qhr-btn-spinner-action" class="qhr-btn-spinner hx-indicator" style="display: none;" aria-hidden="true">
    <svg class="qhr-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 11-6.219-8.56"/>
    </svg>
  </span>
</button>
