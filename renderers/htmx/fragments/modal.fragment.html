<!-- Qahera UI Kit - HTMX Dynamic Modal Fragment -->
<div class="qhr-modal-backdrop" 
     x-data="qhrModal()" 
     x-init="show()" 
     x-show="open" 
     @keydown.escape.window="hide()" 
     @click.self="hide()" 
     x-cloak
     role="presentation">
  <div class="qhr-modal-dialog qhr-modal-dialog--md" 
       x-ref="dialog" 
       role="dialog" 
       aria-modal="true" 
       tabindex="-1">
    <div class="qhr-modal-header">
      <h3 class="qhr-modal-title">تأكيد الإجراء الحرج</h3>
      <button type="button" class="qhr-modal-close" @click="hide()" aria-label="إغلاق">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="qhr-modal-body">
      <p>سيتم تنفيذ التغييرات المطلوبة فور تأكيدك لهذا الإجراء.</p>
    </div>

    <div class="qhr-modal-footer">
      <button type="button" class="qhr-btn qhr-btn--secondary qhr-btn--sm" @click="hide()">إلغاء</button>
      <button 
        type="button" 
        class="qhr-btn qhr-btn--primary qhr-btn--sm"
        hx-post="/api/confirm"
        hx-target="closest .qhr-modal-backdrop"
        hx-swap="outerHTML"
      >
        تأكيد ومتابعة
      </button>
    </div>
  </div>
</div>
