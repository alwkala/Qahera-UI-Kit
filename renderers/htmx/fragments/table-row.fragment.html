<!-- Qahera UI Kit - HTMX Table Row Fragment (View State) -->
<tr id="table-row-101" class="qhr-table-row">
  <td class="qhr-table-td">
    <div style="display: flex; align-items: center; gap: var(--qhr-space-2);">
      <span class="qhr-avatar qhr-avatar--circle qhr-avatar--xs">مح</span>
      <strong>محمد القاسم</strong>
    </div>
  </td>
  <td class="qhr-table-td">مهندس بنية سحابية</td>
  <td class="qhr-table-td">
    <span class="qhr-badge qhr-badge--success qhr-badge--sm">نشط</span>
  </td>
  <td class="qhr-table-td" style="text-align: end; white-space: nowrap;">
    <button 
      type="button" 
      class="qhr-btn qhr-btn--ghost qhr-btn--sm"
      hx-get="/api/users/101/edit"
      hx-target="closest tr"
      hx-swap="outerHTML"
      aria-label="تعديل السطر"
    >
      <svg class="qhr-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span>تعديل</span>
    </button>
    <button 
      type="button" 
      class="qhr-btn qhr-btn--ghost qhr-btn--sm"
      style="color: var(--qhr-color-danger-600);"
      hx-delete="/api/users/101"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-confirm="هل أنت متأكد من رغبتك في حذف هذا السجل؟"
      aria-label="حذف السجل"
    >
      <svg class="qhr-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </td>
</tr>
