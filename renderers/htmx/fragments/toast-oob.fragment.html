<!-- Qahera UI Kit - HTMX Out-of-Band Toast Fragment (Static / Language-Agnostic) -->
<div id="qhr-toast-notification-oob" 
     class="qhr-toast qhr-toast--success" 
     hx-swap-oob="beforeend:.qhr-toast-container"
     role="status"
     x-data="{ show: true }"
     x-show="show"
     x-init="setTimeout(() => { show = false; $el.remove(); }, 4000)">
  <span class="qhr-toast-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
  </span>
  <div class="qhr-toast-body">
    <div class="qhr-toast-title">تمت العملية بنجاح</div>
    <div class="qhr-toast-msg">تم حفظ التغييرات وتحديث السجل المعني.</div>
  </div>
  <button type="button" 
          class="qhr-toast-close" 
          @click="show = false; $el.closest('.qhr-toast').remove()" 
          aria-label="إغلاق الإشعار">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
