version: 1.0.0
description: "Authoritative Canonical Cairo Design Atlas Registry for Qahera UI Kit"
invariants:
  - "QAHERA-THEME-001: Every archetype acts as a cultural vector translating a Cairo neighborhood DNA into 8 concrete design dimensions."
  - "The 8 Dimensions: Color, Typography, Geometry/Radius, Border, Shadow/Glow, Material/Texture, Density, Motion."
  - "100% Dual-Mode: Every archetype supports Day Mode and Night Mode without altering its core geometry or motion character."

archetypes:
  - id: zamalek
    name: "الزمالك"
    name_en: "Zamalek"
    cultural_vector: "Egyptian Cosmopolitanism × Nile Island × Diplomatic Mansions"
    design_movement: "Cosmopolitan Art Deco & Emerald"
    palette_night: { bg: "#0B130E", surface: "#121E17", primary: "#2E7D5B", accent: "#F2C94C" }
    palette_day: { bg: "#F2F8F4", surface: "#FFFFFF", primary: "#1B5E41", accent: "#D4AF37" }
    radius: { box: "12px", field: "6px", selector: "9999px" }
    border_width: "1px"
    shadow: "0 10px 30px -5px rgba(0,0,0,0.35)"
  - id: downtown
    name: "وسط البلد"
    name_en: "Downtown"
    cultural_vector: "Khedivial Cairo × Mediterranean European × Publishing & Arts"
    design_movement: "Khedivial Classical & Editorial Swiss"
    palette_night: { bg: "#161311", surface: "#211D19", primary: "#C29B38", accent: "#9B3133" }
    palette_day: { bg: "#F6F3EC", surface: "#FFFFFF", primary: "#9E7728", accent: "#832729" }
    radius: { box: "2px", field: "2px", selector: "2px" }
