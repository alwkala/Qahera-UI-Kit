version: 1.0.0
category: typography
description: Canonical typography configuration with Alexandria and Cairo as primary fonts and curated secondary alternatives

families:
  primary: "'Alexandria', 'Cairo', system-ui, -apple-system, sans-serif"
  heading: "'Alexandria', 'Cairo', system-ui, sans-serif"
  body: "'Cairo', 'Alexandria', system-ui, -apple-system, sans-serif"
  display: "'Alexandria', 'Cairo', sans-serif"
  mono: "'JetBrains Mono', 'Fira Code', monospace"

secondary_alternatives:
  arabic_display_heritage: "'El Messiri', serif"
  arabic_body_alt: "'Tajawal', sans-serif"
  arabic_tech: "'IBM Plex Sans Arabic', sans-serif"
  latin_display: "'Plus Jakarta Sans', sans-serif"
  latin_clean: "'Inter', sans-serif"

banned_fonts:
  - "Amiri"

weights:
  normal: "400"
  medium: "500"
  semibold: "600"
  bold: "700"

scale:
  xs:
    size: "0.75rem"
    line_height: "1rem"
  sm:
    size: "0.875rem"
    line_height: "1.25rem"
  base:
    size: "1rem"
    line_height: "1.5rem"
  lg:
    size: "1.125rem"
    line_height: "1.75rem"
  xl:
    size: "1.25rem"
    line_height: "1.75rem"
  2xl:
    size: "1.5rem"
    line_height: "2rem"
  3xl:
    size: "1.875rem"
    line_height: "2.25rem"
  4xl:
    size: "2.25rem"
    line_height: "2.5rem"
